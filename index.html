<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anon — Private, Unnamed Conversation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ======================= INTRO / BRAND SCREEN ======================= -->
  <div id="intro-overlay" class="intro-overlay">
    <div class="intro-mark">
      <span class="intro-glyph">A</span>
      <span class="intro-word">ANON</span>
    </div>
  </div>

  <!-- ======================= ENTRY MODAL ======================= -->
  <div id="entry-overlay" class="overlay" hidden>
    <div id="entry-card" class="entry-card">
      <div class="entry-eyebrow">Private &amp; unnamed</div>
      <h1>Enter, without a name.</h1>
      <p class="entry-sub">No account, no trace. Two details, then you're connected.</p>

      <form id="entry-form" autocomplete="off">
        <label class="field">
          <span class="field-label">Age</span>
          <input type="number" id="input-age" min="18" max="99" placeholder="e.g. 27" required />
        </label>

        <fieldset class="field field--segmented">
          <span class="field-label">Sex</span>
          <div class="segmented" role="radiogroup" aria-label="Sex">
            <input type="radio" name="sex" id="sex-male" value="male" checked />
            <label for="sex-male"><span class="seg-glyph">♂</span>Male</label>
            <input type="radio" name="sex" id="sex-female" value="female" />
            <label for="sex-female"><span class="seg-glyph">♀</span>Female</label>
          </div>
        </fieldset>

        <p id="entry-error" class="entry-error" hidden></p>

        <button type="submit" id="entry-submit">
          <span class="btn-label">Connect</span>
          <span class="btn-spinner" hidden></span>
        </button>
      </form>

      <p class="entry-footnote">By entering you agree to keep it respectful.</p>
    </div>
  </div>

  <!-- ======================= MAIN DASHBOARD ======================= -->
  <div id="dashboard" class="dashboard" hidden>

    <!-- ---------- Sidebar: user directory ---------- -->
    <aside class="sidebar">
      <div class="me-card">
        <span class="pulse-dot"></span>
        <div>
          <div class="me-label">Connected as</div>
          <div id="me-detail" class="me-detail">—</div>
        </div>
      </div>

      <div class="filter-row" role="tablist" aria-label="Filter online users">
        <button class="filter-pill is-active" data-filter="all">All</button>
        <button class="filter-pill" data-filter="male">Men</button>
        <button class="filter-pill" data-filter="female">Women</button>
      </div>

      <div class="directory-header">
        <span>Online now</span>
        <span id="online-count" class="online-count">0</span>
      </div>

      <ul id="user-list" class="user-list"></ul>

      <p id="empty-state" class="empty-state">No one else is online right now.</p>
    </aside>

    <!-- ---------- Right: DM window ---------- -->
    <main class="chat-panel">
      <header class="chat-header">
        <div>
          <div id="chat-with" class="chat-with">Select someone to begin</div>
          <div id="chat-status" class="chat-status"></div>
        </div>
      </header>

      <div id="chat-log" class="chat-log">
        <p class="chat-placeholder">Your conversation will appear here.</p>
      </div>

      <div id="limit-banner" class="limit-banner" hidden></div>

      <form id="message-form" class="message-form">
        <input
          type="text"
          id="message-input"
          placeholder="Select a conversation to start typing…"
          maxlength="2000"
          disabled
          autocomplete="off"
        />
        <button type="submit" id="send-btn" disabled aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3.4 20.6L21 12 3.4 3.4 3 10l12 2-12 2 .4 6.6z" fill="currentColor"/>
          </svg>
        </button>
      </form>
    </main>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
